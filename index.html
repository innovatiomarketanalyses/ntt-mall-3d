<meta charset="utf-8">
<title>NTT Mall 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* One-screen viewer: full-bleed 3D canvas, small title top-left, view and light controls bottom. */
:root { --bg:#d9d2c6; --panel:rgba(251,250,248,.9); --fg:#23201c; --line:#cfc9bf; --accent:#9a6540; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#17150f; --panel:rgba(31,28,22,.9); --fg:#ece7de; --line:#3a362d; --accent:#c58a5c; color-scheme: dark; } }
:root[data-theme="dark"] { --bg:#17150f; --panel:rgba(31,28,22,.9); --fg:#ece7de; --line:#3a362d; --accent:#c58a5c; color-scheme: dark; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: "IBM Plex Mono", ui-monospace, monospace; overflow: hidden; }
#stage { position: absolute; inset: 0; touch-action: none; cursor: grab; }
#stage:active { cursor: grabbing; }
canvas { display: block; width: 100%; height: 100%; }
.title { position: absolute; top: 12px; left: max(16px, env(safe-area-inset-left, 0px)); background: var(--panel); border: 1px solid var(--line); padding: 8px 12px; pointer-events: none; }
.title b { font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-size: 22px; letter-spacing: .04em; text-transform: uppercase; display: block; line-height: 1; }
.title span { font-size: 11px; opacity: .7; }
.bar { position: absolute; bottom: 12px; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; pointer-events: none; }
.grp { display: flex; flex-wrap: wrap; gap: 4px; background: var(--panel); border: 1px solid var(--line); padding: 4px; pointer-events: auto; }
button { font: 500 12px "IBM Plex Mono", monospace; color: var(--fg); background: transparent; border: 1px solid transparent; padding: 7px 10px; cursor: pointer; }
button:hover { border-color: var(--line); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.hint { position: absolute; top: 12px; right: max(16px, env(safe-area-inset-right, 0px)); font-size: 11px; background: var(--panel); border: 1px solid var(--line); padding: 8px 10px; pointer-events: none; }
@media (max-width: 560px) { .hint { display: none; } }
#card { position: absolute; top: 64px; left: max(16px, env(safe-area-inset-left, 0px)); max-width: min(320px, calc(100% - 32px)); background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--accent); padding: 10px 12px; font-size: 12px; line-height: 1.5; pointer-events: none; }
#card b { font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-size: 20px; letter-spacing: .03em; text-transform: uppercase; display: block; line-height: 1.1; }
#card[hidden] { display: none; }
</style>

<div id="stage"></div>
<div class="title"><b>NTT Mall</b><span>Concept render v1.3 · 100 × 100 m</span></div>
<div class="hint">Drag to orbit · scroll or pinch to zoom · click any building</div>
<div id="card" hidden><b id="ct"></b><span id="cd"></span></div>
<div class="bar">
  <div class="grp" id="views" role="group" aria-label="Views">
    <button data-v="street" aria-pressed="true">From N4</button>
    <button data-v="gate" aria-pressed="false">Gate</button>
    <button data-v="mall" aria-pressed="false">Mall</button>
    <button data-v="rear" aria-pressed="false">Rear</button>
    <button data-v="station" aria-pressed="false">Fuel</button>
    <button data-v="yard" aria-pressed="false">Trucks</button>
    <button data-v="aerial" aria-pressed="false">Aerial</button>
  </div>
  <div class="grp" id="inst" role="group" aria-label="Institute">
    <button data-i="0" aria-pressed="true">Institute closed</button>
    <button data-i="1" aria-pressed="false">Open interior</button>
  </div>
  <div class="grp" id="modes" role="group" aria-label="Light">
    <button data-m="day" aria-pressed="false">Day</button>
    <button data-m="dusk" aria-pressed="true">Dusk</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    [[-0.95, 1.3], [0.95, 1.3], [-0.95, -1.3], [0.95, -1.3]].forEach(function (w) {

    var win = new THREE.Mesh(new THREE.BoxGeometry(2.3, 0.9, 0.05), mat.glass); win.position.set(0, 2.6, 1.22);
    var hl = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.2, 0.05), mat.lamp); hl.position.set(0, 1.0, 1.22);

    else { trailer = new THREE.Mesh(new THREE.BoxGeometry(2.5, 3.2, 12.2), mat.white); trailer.position.set(0, 2.5, -7.4); }

    [[0, 0.5], [0, -9.8], [0, -11.2], [0, -12.6]].forEach(function (w) {
